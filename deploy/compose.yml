services:
  sandbox-control:
    build:
      context: ..
      dockerfile: Dockerfile
      network: host
    image: sandbox-control:local
    env_file:
      - ../.env
    environment:
      SANDBOX_CONTROL_API_HOST: 0.0.0.0
      SANDBOX_CONTROL_API_PORT: "8080"
      SANDBOX_CONTROL_FRONTEND_DIST: apps/web/dist
    ports:
      - "8080:8080"
    volumes:
      - sandbox-control-runtime:/app/apps/api/.runtime
    depends_on:
      - postgres
      - redis
      - minio
      - registry
      - consul
      - nomad
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: sandbox-control
      POSTGRES_USER: sandbox-control
      POSTGRES_DB: sandbox-control
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sandbox
      MINIO_ROOT_PASSWORD: sandbox-control-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  registry:
    image: registry:2
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped

  consul:
    image: hashicorp/consul:latest
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul-data:/consul/data
    restart: unless-stopped

  nomad:
    image: hashicorp/nomad:latest
    command: agent -dev -bind=0.0.0.0
    privileged: true
    environment:
      NOMAD_ADDR: http://127.0.0.1:4646
    ports:
      - "4646:4646"
      - "4647:4647"
      - "4648:4648"
    volumes:
      - nomad-data:/nomad/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  edge-proxy:
    image: caddy:2-alpine
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "8088:8088"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - sandbox-control
    restart: unless-stopped

volumes:
  sandbox-control-runtime:
  postgres-data:
  minio-data:
  registry-data:
  consul-data:
  nomad-data:
  caddy-data:
  caddy-config:
