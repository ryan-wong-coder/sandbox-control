[project]
name = "sandbox-control"
version = "0.1.0"
description = "Multi-user internal control plane for experimental E2B sandboxes and remote Codex sessions."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.124.0",
  "uvicorn[standard]>=0.38.0",
  "pydantic>=2.12.0",
  "cryptography>=46.0.0",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
